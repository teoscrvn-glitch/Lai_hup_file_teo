# /etc/nginx/sites-available/laihupfile
# sudo ln -s /etc/nginx/sites-available/laihupfile /etc/nginx/sites-enabled/

# Ẩn version Nginx trong header + trang lỗi mặc định (đặt trong http{} của nginx.conf chính,
# hoặc uncomment nếu file này được include trực tiếp vào http block)
# server_tokens off;

# Giới hạn request body ở tầng Nginx (khớp UPLOAD_MAX_SIZE_MB trong .env backend)
client_max_body_size 220M;

# Giới hạn kết nối/tốc độ theo IP (chống DDoS ở tầng Nginx, bổ sung cho rate-limit ứng dụng)
limit_req_zone $binary_remote_addr zone=laihupfile_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=laihupfile_login:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=laihupfile_conn:10m;

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    server_tokens off;

    # Certbot sẽ tự chèn block redirect HTTPS vào đây (chạy certbot --nginx)

    limit_conn laihupfile_conn 20;

    # ----- Security headers (lớp thứ 2, cạnh Helmet ở tầng Node) -----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ----- Nén dữ liệu tĩnh (gzip; Brotli cần module ngx_brotli riêng nếu muốn bật) -----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;

    # ----- Chặn truy cập trực tiếp thư mục lưu file trả phí (lớp bảo vệ thứ 2, cạnh backend) -----
    location /uploads/paid/ {
        deny all;
        return 403;
    }
    location ~ /\.env {
        deny all;
        return 403;
    }
    location ~ /\.git {
        deny all;
        return 403;
    }

    # ----- Đường dẫn quản trị: giới hạn tốc độ nghiêm ngặt hơn -----
    # THAY /admin-panel-x7q9k2/ bằng đúng giá trị ADMIN_PANEL_PATH trong .env backend.
    location /admin-panel-x7q9k2/ {
        limit_req zone=laihupfile_login burst=5 nodelay;
        # (tuỳ chọn) chỉ cho phép IP nội bộ/VPN truy cập trang quản trị:
        # allow 1.2.3.4;
        # deny all;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/login {
        limit_req zone=laihupfile_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=laihupfile_general burst=30 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
